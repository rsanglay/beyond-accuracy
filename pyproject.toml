[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-accuracy"
version = "0.1.0"
description = "Machine learning trading research under realistic market frictions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
beyond-accuracy = "beyond_accuracy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
